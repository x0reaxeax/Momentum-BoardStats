; Internal HUD settings. Ctrl+Alt+R reloads this file while playing.
; X/Y are backbuffer pixels from top-left; -1 uses Corner/Margin for that axis.
[HUD]
GradeColors=1
GradeSpeedScale=1
GradeReferenceSpeed=1500
Corner=top-right
X=-1
Y=-1
Margin=24
Scale=100
; 0=full panel, 1=small panel, 2=centered text only
Compact=0
; Mode 2 offset from screen center: negative=up, positive=down. Y overrides this.
CenterYOffset=0
; 0=retained percentage, 1=lost percentage (100 - retention; negative means gain)
ShowLoss=0
; 0 keeps the latest board visible; otherwise 0..60000 milliseconds.
DurationMs=0
; Previous boards: 0..3
History=3
ShowChange=1
ShowRetention=1
ShowAngle=1
ShowSpeeds=1
ShowHorizontal=0

; First matching grade wins; both limits must pass.
; Effective maximum loss = MaxLossPercent * sqrt(incoming 3D speed / reference).
; GradeSpeedScale=0 uses fixed loss thresholds. Terrible is the unconditional fallback.
[Grade.Perfect]
MaxLossPercent=0.5
MinAngle=85
Color=80,160,255
[Grade.Good]
MaxLossPercent=1.5
MinAngle=80
Color=100,230,130
[Grade.Okay]
MaxLossPercent=3.0
MinAngle=75
Color=255,255,255
[Grade.Bad]
MaxLossPercent=5.0
MinAngle=60
Color=255,220,80
[Grade.Terrible]
Color=255,90,90
